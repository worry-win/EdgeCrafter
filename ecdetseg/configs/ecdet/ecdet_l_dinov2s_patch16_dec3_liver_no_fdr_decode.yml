__include__: [
  'ecdet_l_dinov2s_patch16_dec3_liver.yml',
]

output_dir: outputs/ablation/ecdet_l_dinov2s_patch16_dec3_liver_no_fdr_decode

# Continuous bbox regression is authoritative; distribution remains auxiliary
# so GO-DDF stays a valid, explicitly isolated comparison.
ECTransformer:
  use_fdr_decode: false
  use_aux_distribution: true
  use_lqe: false

ECCriterion:
  use_uni_set: true
  use_fgl: true
  use_ddf: true
