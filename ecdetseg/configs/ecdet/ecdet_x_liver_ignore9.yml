__include__: [
  'ecdet_x.yml',
]

# ECDet-X fine-tuning on the strict 9-class liver split. The output directory
# and tuning checkpoint are selected by the Slurm launcher.
output_dir: outputs/ecdet_x_liver_ignore9
num_classes: 9
remap_mscoco_category: false

train_dataloader:
  total_batch_size: 32
  num_workers: 8
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_liver/img
    ann_file: /cobot/Data/Lesion_det/det_liver/annotations/train_ignore_9_12.json

val_dataloader:
  total_batch_size: 32
  num_workers: 8
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_liver/img
    ann_file: /cobot/Data/Lesion_det/det_liver/annotations/valid_ignore_9_12.json
