__include__: [
  'ecdet_l_dinov2s_patch16_dec3_liver_ec_full_ignore9.yml',
]

output_dir: outputs/ablation/ecdet_l_dinov2s_patch16_dec3_liver_no_dfine_ignore9

# Strict algorithmic no-D-FINE control. Keep EC attention, MAL and CDN so this
# isolates FDR/LQE/FGL/DDF/GO and the D-FINE pre-head supervision path.
ECTransformer:
  use_fdr_decode: false
  use_aux_distribution: false
  use_lqe: false
  use_pre_outputs: false

ECCriterion:
  losses: ['mal', 'boxes']
  use_uni_set: false
  use_fgl: false
  use_ddf: false
