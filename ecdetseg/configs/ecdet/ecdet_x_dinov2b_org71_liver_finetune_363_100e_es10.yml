__include__: ['ecdet_x_dinov2b_multi_organ_71_363_50e_bs80.yml']

# Complete 71-class DINOv2-B + EC-X detector -> 7-class Liver.
output_dir: outputs/ablation/ecdet_x_dinov2b_org71_liver_finetune_363_100e_es10
num_classes: 7
remap_mscoco_category: false
epochs: 100
early_stop_patience: 10

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone\.backbone)(?!.*(?:norm|bias|pos_embed|gamma_)).*$'
      lr: 0.000005
    -
      params: '^(?=.*backbone\.backbone)(?=.*(?:norm|bias|pos_embed|gamma_)).*$'
      lr: 0.000005
      weight_decay: 0.0
    -
      params: '^(?=.*backbone\.projector)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0005
    -
      params: '^(?=.*backbone\.projector)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0005
      weight_decay: 0.0
    -
      params: '^(?!backbone\.)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

train_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_liver/img
    ann_file: /cobot/Data/Lesion_det/det_liver/annotations/Lesion/Ignore_Delete-Image/train.json
    transforms:
      stop_epoch: 98

val_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_liver/img
    ann_file: /cobot/Data/Lesion_det/det_liver/annotations/Lesion/Ignore_Delete-Image/valid.json
