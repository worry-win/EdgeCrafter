__include__: [
  'ecdet_x_lw_xlarge_liver_objects365_363_50e.yml',
]

# Objects365 initializes only the LW encoder. EC-X projector/neck/decoder are random.
output_dir: outputs/ablation/ecdet_breast_lw_objects365_ecx_random_100e_es10
num_classes: 4
remap_mscoco_category: false
epochs: 100
early_stop_patience: 10

train_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_breast/img
    ann_file: /cobot/Data/Lesion_det/det_breast/annotations/Lesion/Ignore_Delete-Image/train.json
    transforms:
      stop_epoch: 98

val_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_breast/img
    ann_file: /cobot/Data/Lesion_det/det_breast/annotations/Lesion/Ignore_Delete-Image/valid.json
