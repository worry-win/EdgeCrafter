__include__: [
  'ecdet_l_dinov2s_patch16_dec3_liver.yml',
]

# DINOv2-S no-register baseline for breast lesions. Source category 10 is
# removed and retained categories are remapped to contiguous labels 0..7.
output_dir: outputs/ablation/ecdet_l_dinov2s_patch16_dec5_breast_ignore10
num_classes: 8
remap_mscoco_category: False

train_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_breast/img
    ann_file: /cobot/Data/Lesion_det/det_breast/annotations/train_ignore_10_remap.json

val_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: /cobot/Data/Lesion_det/det_breast/img
    ann_file: /cobot/Data/Lesion_det/det_breast/annotations/valid_ignore_10_remap.json

ECTransformer:
  num_layers: 5
  eval_idx: -1
  num_levels: 3
  num_points: [3, 6, 3]
  cross_attn_method: default

epochs: 150
early_stop_patience: 30
early_stop_min_delta: 0.0
