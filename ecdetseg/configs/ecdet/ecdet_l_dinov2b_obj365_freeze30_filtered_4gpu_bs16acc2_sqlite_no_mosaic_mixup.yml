# Keep only image IDs and category metadata in every rank's RAM.  Paths and
# annotations are queried from this read-only database for the current batch.
train_dataloader:
  # SQLite connections are created in workers, so these processes no longer
  # inherit a multi-gigabyte COCO Python index.
  num_workers: 4
  dataset:
    type: SqliteCocoDetection
    sqlite_file: /cobot/Code/wanrui/EdgeCrafter/outputs/obj365_validation/zhiyuan_objv2_train_filtered_existing.sqlite

# Evaluation still uses the established COCO JSON implementation, so the
# metrics and official ground-truth handling remain unchanged.
