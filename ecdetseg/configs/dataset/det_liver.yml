task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']
  verbose: True

num_classes: 13
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /cobot/Data/Lesion_det/det_liver/img
    ann_file: /cobot/Data/Lesion_det/det_liver/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 8
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /cobot/Data/Lesion_det/det_liver/img
    ann_file: /cobot/Data/Lesion_det/det_liver/annotations/valid.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 8
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
